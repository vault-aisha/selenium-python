name: Selenium Python E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e-tests:
    runs-on: windows-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install allure-pytest webdriver-manager pytest-xdist

      # Install Allure CLI
      - name: Install Allure CLI
        run: |
          scoop install allure || choco install allure

      # Run Selenium tests
      - name: Run tests
        run: |
          pytest -n auto --alluredir=reports/allure-results --html=reports/html-report.html --self-contained-html

      # Upload Allure results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: reports/allure-results

      # Upload HTML report
      - name: Upload HTML Report
        uses: actions/upload-artifact@v3
        with:
          name: html-report
          path: reports/html-report.html
